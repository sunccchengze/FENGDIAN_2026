version: stable_training_v1
seed: 42
base_config: stochastic_inflow.yaml
horizon: 128
dt_s: 1.0
screen_steps: 8192
bridge_steps: 8192
confirm_steps: 16384
eval_every: 2048
warmup_steps: 256
update_every: 2
confirmation_repeats: 3
cases_per_family: 2
candidate_rule: lowest_validation_best_rmse_then_candidate_order
checkpoint_rule: validation_only_strict_improvement_including_initial
test_rule: open_only_after_selection_and_all_confirmations_are_frozen
selection_families:
- fixed
- stationary
- ramp
- gust
- direction
stress_families:
- shortfall
training_targets_w:
- 2400000.0
- 3000000.0
- 3600000.0
training_scenarios:
- fixed
- stationary
- ramp
- gust
- direction
noise_std:
- 0.05
- 0.15
- 0.08
noise_end_fraction: 0.2
noise_correlation_s:
- 10.0
- 3.0
- 5.0
candidates:
- name: original
  parent: null
  nominal_init: false
  reward_scale: 1.0
  actor_lr: 0.0003
  noise: white
- name: nominal
  parent: original
  nominal_init: true
  reward_scale: 1.0
  actor_lr: 0.0003
  noise: white
- name: scaled
  parent: nominal
  nominal_init: true
  reward_scale: 100.0
  actor_lr: 0.0003
  noise: white
- name: slow_actor
  parent: scaled
  nominal_init: true
  reward_scale: 100.0
  actor_lr: 0.0001
  noise: white
- name: correlated
  parent: slow_actor
  nominal_init: true
  reward_scale: 100.0
  actor_lr: 0.0001
  noise: correlated
stability_gate:
  finite_and_domain_valid: true
  selected_not_worse_than_initial_each_repeat: true
  selected_fixed_rmse_w: 200000.0
  max_final_over_selected_validation_ratio: 1.25
  note: These are predeclared mock engineering gates, not physical certification or
    superiority over PI.
