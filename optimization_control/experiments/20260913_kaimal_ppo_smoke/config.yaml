environment_config:
  environment:
    rotor_tau_s: 5.0
    semantics: finite-horizon task; current reference is held for the next action
      interval
  reference:
    headroom_fraction: 0.2
    low_pass_time_constant_s: 20.0
    ramp_down_limit_w_s: 50000.0
    ramp_up_limit_w_s: 50000.0
  seed: 42
  source:
    kind: assumption
    method: Kaimal longitudinal spectrum, TurbSim v2 Eq. 23
    note: Single-point band-limited synthetic training wind. Numeric parameters are
      design assumptions, not site fits or IEC certification.
    reference: https://openfast.readthedocs.io/en/main/_downloads/cb14d3e2d3533d76e405d730fea19846/TurbSim_v2.00.pdf
  version: stochastic_single_v2
  wind:
    dt_s: 1.0
    duration_s: 600.0
    gust_amplitude_m_s: 1.5
    gust_duration_s: 40.0
    length_scale_m: 100.0
    max_attempts: 100
    mean_max_m_s: 10.0
    mean_min_m_s: 6.0
    padding_factor: 8
    ramp_amplitude_m_s: 1.0
    scenario: mixed
    speed_max_m_s: 16.0
    speed_min_m_s: 0.5
    ti_values:
    - 0.06
    - 0.08
    - 0.1
seed: 42
training:
  anneal_lr: true
  clip_coef: 0.2
  ent_coef: 0.0
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0003
  max_grad_norm: 0.5
  num_envs: 2
  num_minibatches: 8
  num_steps: 1024
  output_dir: optimization_control\experiments\20260913_kaimal_ppo_smoke
  run_tag: kaimal_smoke_v2
  save_model: true
  seed: 42
  torch_threads: 1
  total_timesteps: 8192
  update_epochs: 2
  vf_coef: 0.5
  wind_config: optimization_control\ppo_single_turbine\configs\stochastic_wind_v1.yaml
versions:
  gymnasium: 1.3.0
  numpy: 2.5.1
  torch: 2.13.0+cpu
