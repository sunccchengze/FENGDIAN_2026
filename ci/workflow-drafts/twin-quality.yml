name: Twin quality gates

on:
  pull_request:
    branches: [main]
    paths:
      - "twin/**"
      - ".github/workflows/twin-quality.yml"
  push:
    branches: [main]
    paths:
      - "twin/**"
      - ".github/workflows/twin-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  twin:
    name: lint · selftest · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: twin/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run verification gates
        run: npm run verify
