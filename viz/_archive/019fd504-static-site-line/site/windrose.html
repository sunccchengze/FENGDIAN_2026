<section class="wrap pg-hero"><h1>🌬️ 风玫瑰</h1><p>各风向下的功率提升幅度 (%)——偏航优化的风向敏感性</p></section>
<main class="wrap">
  <div class="card"><div class="chart" id="rose"></div>
    <div class="note" id="roseNote"></div></div>
  <div class="note">数据来自 <code>cases_windrose_opt.csv</code>（FLORIS 占位）。各风向平均增益最高处即偏航优化的重点风向。注：袁夫达/田铭雨补齐真实风况后替换数据源即可。</div>
</main>
<footer class="wrap">孙承泽 · 可视化模块</footer>
<script src="assets/data.js"></script><script src="assets/js/charts.js"></script>
<script>const W=window.WIND_DATA;
const map={};W.windrose_opt.forEach(r=>{(map[r.wind_direction]=map[r.wind_direction]||[]).push(r.gain_pct);});
const angles=Object.keys(map).map(Number).sort((a,b)=>a-b);
const values=angles.map(d=>{const a=map[d];return a.reduce((x,y)=>x+y,0)/a.length;});
window.CHARTS.polarRose(document.getElementById("rose"),{angles,values});
const maxG=Math.max(...values),maxD=angles[values.indexOf(maxG)];
document.getElementById("roseNote").innerHTML=`各风向平均增益：最高约 <b class="good">${maxG.toFixed(1)}%</b>（风向 ${maxD}°）。`;</script>
</body></html>
