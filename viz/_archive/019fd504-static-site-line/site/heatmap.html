<section class="wrap pg-hero"><h1>🔥 热力矩阵</h1><p>偏航角 × 风速功率增益矩阵，覆盖 6~12 m/s 全风速工况</p></section>
<main class="wrap">
  <div class="card"><div class="chart" id="hm"></div>
  <div class="note">单元格 = 相对偏航 0° 基准的功率增益 (%)。颜色越红增益越大。可见中高风速段、正偏航角区间增益最显著。</div></div>
</main>
<footer class="wrap">孙承泽 · 可视化模块</footer>
<script src="assets/data.js"></script><script src="assets/js/charts.js"></script>
<script>const m=window.WIND_DATA.multi,xs=m.wind_speeds,ys=m.yaw_angles;
const mat=xs.map(U=>{const i=xs.indexOf(U);const p0=m.ptot[i][ys.indexOf(0)];
  return ys.map(y=>{const p=m.ptot[i][ys.indexOf(y)];return (p-p0)/p0*100;});});
window.CHARTS.heatmap(document.getElementById("hm"),{xs,ys,matrix:mat});</script>
