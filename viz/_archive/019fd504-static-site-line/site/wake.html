<section class="wrap pg-hero"><h1>📊 尾流分析</h1><p>交互式速度场云图，代理模型实时预测任意偏航角下的功率输出</p></section>
<main class="wrap">
  <div class="card"><div class="gallery">
    <img src="assets/img/fields/yaw_-30.png" alt="yaw -30"><img src="assets/img/fields/yaw_-15.png" alt="yaw -15">
    <img src="assets/img/fields/yaw_+00.png" alt="yaw 0"><img src="assets/img/fields/yaw_+15.png" alt="yaw 15">
    <img src="assets/img/fields/yaw_+30.png" alt="yaw 30">
  </div>
  <div class="note">上：不同上游偏航角下的流场速度分布（FLORIS 工程尾流模型）。尾流低速区随偏航角偏移，是功率增益的来源。代理模型 <code>predict_power(yaw, U)</code> 可在浏览器内实时预测任意风况下的 P₁/P₂。</div>
  <div class="chart" id="wakeChart" style="margin-top:14px"></div>
  </div>
</main>

<script src="assets/data.js"></script><script src="assets/js/interp.js"></script><script src="assets/js/charts.js"></script>
<script>const W=window.WIND_DATA;const m=W.multi,i=m.wind_speeds.indexOf(8);
window.CHARTS.lineChart(document.getElementById("wakeChart"),{xs:m.yaw_angles,
 series:[{name:"P1",color:"#4a9eff",data:m.p1[i]},{name:"P2",color:"#27ae60",data:m.p2[i]},{name:"Ptot",color:"#f5a623",data:m.ptot[i]}],
